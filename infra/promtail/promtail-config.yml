# Scrapes Docker container stdout for compose project "roomly" → Loki.
# Expects Nest/pino JSON lines (disable LOG_PRETTY for reliable parsing).
# Keep the full JSON line so Grafana derivedFields / | json | trace_id=… work.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: roomly-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=roomly"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Docker json-file driver: {"log":"...","stream":"stdout","time":"..."}
      - docker: {}
      # Promote pino fields to Loki labels (line body stays full JSON).
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
