# Prometheus scrapes Nest /metrics + infra exporters.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: roomly-nest
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3000
          - user-service:3001
          - notification-service:3002
        labels:
          project: roomly

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          project: roomly

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          project: roomly

  # Native RabbitMQ Prometheus plugin (:15692).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          project: roomly
