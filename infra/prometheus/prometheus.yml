# Prometheus scrapes Nest metrics via OTEL Collector + infra exporters.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Nest OTLP metrics → Collector prometheus exporter.
  - job_name: roomly-nest
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          project: roomly

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          project: roomly

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          project: roomly

  # Native RabbitMQ Prometheus plugin (:15692).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          project: roomly
