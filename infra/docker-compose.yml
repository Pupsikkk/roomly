name: roomly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly}
      # Subdir so bind-mount parent can keep .gitkeep without breaking initdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-roomly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-roomly}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Minimal tracing backend (OTLP in → UI).
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"

  # Log store (Promtail scrapes Docker stdout → here).
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki/data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  # Scrapes roomly compose container logs into Loki.
  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Unified UI: Loki logs + Jaeger traces (Prometheus metrics later).
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    depends_on:
      - loki
      - jaeger

  gateway:
    build:
      context: ../backend/js
      dockerfile: Dockerfile
    image: roomly-js:local
    env_file: .env
    environment:
      APP: gateway
      PORT: ${GATEWAY_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      # Never load signing secrets into gateway (env_file would otherwise inject them)
      JWT_PRIVATE_KEY: ""
      JWT_PRIVATE_KEY_PATH: ""
      OTEL_SERVICE_NAME: gateway
    ports:
      - "${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  # One-shot: apply user_db migrations before user-service replicas start
  user-migrate:
    image: roomly-js:local
    pull_policy: never
    env_file: .env
    environment:
      APP: user-migrate
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: "no"

  # Same image as gateway — build only once (gateway), then reuse
  user-service:
    image: roomly-js:local
    pull_policy: never
    env_file: .env
    environment:
      APP: user-service
      PORT: ${USER_SERVICE_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      # Private key stays on user-service only (compose secret mount)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH_DOCKER:-/run/secrets/jwt/jwt-private.pem}
      OTEL_SERVICE_NAME: user-service
    volumes:
      - ./secrets/dev:/run/secrets/jwt:ro
    depends_on:
      gateway:
        condition: service_started
      user-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification-service:
    image: roomly-js:local
    pull_policy: never
    env_file: .env
    environment:
      APP: notification-service
      PORT: ${NOTIFICATION_SERVICE_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
