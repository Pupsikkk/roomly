# Dev overlay: bind-mount source + nest --watch
# Usage (from repo root): npm run dev
#
# Build only on gateway — user/notification reuse roomly-js:dev

services:
  gateway:
    build:
      context: ../backend/js
      dockerfile: Dockerfile.dev
    image: roomly-js:dev
    env_file: .env
    environment:
      APP: gateway
      PORT: ${GATEWAY_PORT:-3000}
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      USER_SERVICE_URL: http://user-service:${USER_SERVICE_PORT:-3001}
      NOTIFICATION_SERVICE_URL: http://notification-service:${NOTIFICATION_SERVICE_PORT:-3002}
      HOTEL_SERVICE_URL: http://hotel-service:${HOTEL_SERVICE_PORT:-8000}
      BOOKING_SERVICE_URL: http://booking-service:${BOOKING_SERVICE_PORT:-8001}
      # Never load signing secrets into gateway (env_file would otherwise inject them)
      JWT_PRIVATE_KEY: ""
      JWT_PRIVATE_KEY_PATH: ""
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}"
    volumes:
      - ../backend/js:/app
      - gateway_node_modules:/app/node_modules
    command: ["npm", "run", "start:dev:gateway"]

  # One-shot: apply user_db migrations before user-service starts
  user-migrate:
    image: roomly-js:dev
    pull_policy: never
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
    volumes:
      - ../backend/js:/app
      - user_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    command: ["npm", "run", "migration:run:user"]
    restart: "no"

  user-service:
    image: roomly-js:dev
    pull_policy: never
    env_file: .env
    environment:
      APP: user-service
      PORT: ${USER_SERVICE_PORT:-3001}
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      # Private key stays on user-service only (not mounted on gateway)
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      OTEL_SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ../backend/js:/app
      - user_node_modules:/app/node_modules
      - ./secrets/dev:/run/secrets/jwt:ro
    depends_on:
      gateway:
        condition: service_started
      user-migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "start:dev:user"]

  notification-service:
    image: roomly-js:dev
    pull_policy: never
    env_file: .env
    environment:
      APP: notification-service
      PORT: ${NOTIFICATION_SERVICE_PORT:-3002}
      NODE_ENV: development
      RABBITMQ_HOST: rabbitmq
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ../backend/js:/app
      - notification_node_modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_started
    command: ["npm", "run", "start:dev:notification"]

volumes:
  gateway_node_modules:
  user_node_modules:
  notification_node_modules:
