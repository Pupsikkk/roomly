# Dev overlay: bind-mount source + nest --watch
# Usage (from repo root): npm run dev
#
# Build only on gateway — user/notification reuse roomly-js:dev

services:
  gateway:
    build:
      context: ../backend/js
      dockerfile: Dockerfile.dev
    image: roomly-js:dev
    env_file: ./secrets/.env
    environment:
      APP: gateway
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_PRIVATE_KEY: ""
      JWT_PRIVATE_KEY_PATH: ""
      OTEL_SERVICE_NAME: gateway
    expose:
      - "3000"
    volumes:
      - ../backend/js:/app
      - gateway_node_modules:/app/node_modules
    command: ["npm", "run", "start:dev:gateway"]

  # One-shot: apply user_db migrations before user-service starts
  user-migrate:
    image: roomly-js:dev
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ../backend/js:/app
      - user_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    command: ["npm", "run", "migration:run:user"]
    restart: "no"

  user-service:
    image: roomly-js:dev
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: user-service
      PORT: ${USER_SERVICE_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH_DOCKER:-/run/secrets/jwt/jwt-private.pem}
      OTEL_SERVICE_NAME: user-service
      USER_SERVICE_GRPC_PORT: ${USER_SERVICE_GRPC_PORT:-50051}
    expose:
      - "${USER_SERVICE_PORT:-3001}"
      - "${USER_SERVICE_GRPC_PORT:-50051}"
    volumes:
      - ../backend/js:/app
      - user_node_modules:/app/node_modules
      - ./secrets/dev:/run/secrets/jwt:ro
    depends_on:
      gateway:
        condition: service_started
      user-migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "start:dev:user"]

  notification-service:
    image: roomly-js:dev
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: notification-service
      PORT: ${NOTIFICATION_SERVICE_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-development}
      OTEL_SERVICE_NAME: notification-service
    volumes:
      - ../backend/js:/app
      - notification_node_modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_started
    command: ["npm", "run", "start:dev:notification"]

  media-migrate:
    image: roomly-js:dev
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ../backend/js:/app
      - media_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    command: ["npm", "run", "migration:run:media"]
    restart: "no"

  media-service:
    image: roomly-js:dev
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: media-service
      PORT: ${MEDIA_SERVICE_PORT:-3004}
      NODE_ENV: ${NODE_ENV:-development}
      OTEL_SERVICE_NAME: media-service
    expose:
      - "${MEDIA_SERVICE_PORT:-3004}"
    volumes:
      - ../backend/js:/app
      - media_node_modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_started
      media-migrate:
        condition: service_completed_successfully
      s3mock:
        condition: service_healthy
    command: ["npm", "run", "start:dev:media"]
  hotel-service:
    build:
      context: ../backend/python/hotel-service
      dockerfile: Dockerfile.dev
    image: roomly-hotel:dev
    env_file: ./secrets/.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly}
      HOTEL_DB_NAME: ${HOTEL_DB_NAME:-hotel_db}
      HOTEL_SERVICE_PORT: ${HOTEL_SERVICE_PORT:-8000}
      HOTEL_RELOAD: "1"
      OTEL_SERVICE_NAME: hotel-service
    volumes:
      - ../backend/python/hotel-service:/app
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ../backend/python/booking-service
      dockerfile: Dockerfile.dev
    image: roomly-booking:dev
    env_file: ./secrets/.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-booking_db}
      BOOKING_SERVICE_PORT: ${BOOKING_SERVICE_PORT:-8001}
      HOTEL_SERVICE_URL: ${HOTEL_SERVICE_URL:-http://hotel-service:8000}
      BOOKING_RELOAD: "1"
      OTEL_SERVICE_NAME: booking-service
    volumes:
      - ../backend/python/booking-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      hotel-service:
        condition: service_started

volumes:
  gateway_node_modules:
  user_node_modules:
  notification_node_modules:
  media_node_modules:
