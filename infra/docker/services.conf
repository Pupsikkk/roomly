# Roomly local scale profile (used by npm run up / npm run dev).
# 0 = off, N = replica count.
#
# `obs` is a group flag (0/1): Tempo, Loki, Collector, Prometheus, Grafana
# (+ exporters only when the matching datastore is also enabled).
#
# `gateway=N` (N>1): replicas behind gateway-lb (nginx). Host still uses
# one port (GATEWAY_PORT). Do not scale postgres/redis/rabbitmq/obs UIs.
#
# `loadtest=1`: start k6 once with `npm run up` / `npm run dev`
# (or `npm run loadtest`). Values >1 also set VUs when LOADTEST_VUS
# is unset in .env (e.g. loadtest=3 → 3 VUs). Duration: LOADTEST_DURATION.

# Observability:
obs=1

# Core infrastructure:
postgres=1
redis=1
rabbitmq=1

# Business services:
gateway=1
user-service=1
notification-service=1

# Load test (k6 → gateway-lb): 0=off, 1=on, N>1=on + VUs=N if LOADTEST_VUS unset
loadtest=3
