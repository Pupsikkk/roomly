# Reverse proxy in front of gateway replicas.
# Docker DNS round-robins `gateway` across scaled containers.
# Host still hits a single port (GATEWAY_PORT → this service).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /var/log/nginx/access.log;
  # Docker embedded DNS
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    server_name _;

    location / {
      # Variable forces re-resolve so new replicas are picked up.
      set $gateway_upstream gateway:3000;
      proxy_pass http://$gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_pass_header Set-Cookie;
    }
  }
}
