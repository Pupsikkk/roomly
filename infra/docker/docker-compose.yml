name: roomly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly}
      # Subdir so bind-mount parent can keep .gitkeep without breaking initdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Stable Erlang nodename → stable rabbitmq_cluster label (not rabbit@<container_id>).
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-roomly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-roomly}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ../backend/js
      dockerfile: Dockerfile
    image: roomly-js:local
    env_file: ./secrets/.env
    environment:
      APP: gateway
      # Always 3000 on the Docker network; host port is published by gateway-lb.
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # Never load signing secrets into gateway (env_file would otherwise inject them)
      JWT_PRIVATE_KEY: ""
      JWT_PRIVATE_KEY_PATH: ""
      OTEL_SERVICE_NAME: gateway
    # Host port is on gateway-lb (supports gateway=N scale).
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Single published entrypoint → round-robin across gateway replicas.
  gateway-lb:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./docker/gateway-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  # One-shot: apply user_db migrations before user-service replicas start
  user-migrate:
    image: roomly-js:local
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: user-migrate
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: "no"

  # Same image as gateway — build only once (gateway), then reuse
  user-service:
    image: roomly-js:local
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: user-service
      PORT: ${USER_SERVICE_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      # Private key stays on user-service only (compose secret mount)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH_DOCKER:-/run/secrets/jwt/jwt-private.pem}
      OTEL_SERVICE_NAME: user-service
      USER_SERVICE_GRPC_PORT: ${USER_SERVICE_GRPC_PORT:-50051}
    volumes:
      - ./secrets/dev:/run/secrets/jwt:ro
    expose:
      - "${USER_SERVICE_PORT:-3001}"
      - "${USER_SERVICE_GRPC_PORT:-50051}"
    depends_on:
      gateway:
        condition: service_started
      user-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    image: roomly-js:local
    pull_policy: never
    env_file: ./secrets/.env
    environment:
      APP: notification-service
      PORT: ${NOTIFICATION_SERVICE_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy
