apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
      derivedFields:
        # OTLP body is full pino JSON
        - name: TraceID
          datasourceUid: jaeger
          matcherRegex: '"trace_id"\s*:\s*"([a-fA-F0-9]+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
        # Also as Loki label / structured metadata from OTel context
        - name: TraceID
          datasourceUid: jaeger
          matcherRegex: '([a-fA-F0-9]{32})'
          matcherType: label
          match: 'trace_id'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{compose_service=~".+"} | trace_id=`$${__span.traceId}`'
      nodeGraph:
        enabled: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
