apiVersion: 1

# Drop datasources removed from this file (provisioned entries are otherwise sticky).
deleteDatasources:
  - name: Jaeger
    orgId: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
      derivedFields:
        # OTLP body is full pino JSON
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id"\s*:\s*"([a-fA-F0-9]+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
        # Also as Loki label / structured metadata from OTel context
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '([a-fA-F0-9]{32})'
          matcherType: label
          match: 'trace_id'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{compose_service=~".+"} | trace_id=`$${__span.traceId}`'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service_name
        queries:
          # $$ → literal $ after Grafana provisioning env expansion.
          # Use fixed [5m]: $__rate_interval would be eaten as an empty env var.
          - name: Request rate
            query: 'sum(rate(http_server_request_duration_count{$$__tags}[5m]))'
          - name: Error rate
            query: 'sum(rate(http_server_request_duration_count{$$__tags,http_response_status_code=~"5.."}[5m]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{$$__tags}[5m])))'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
