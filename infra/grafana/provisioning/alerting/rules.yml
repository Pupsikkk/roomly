# Grafana unified alerting — Roomly error detection (minimum).
# Alerting → Alert rules (folder Roomly). Local: watch Firing in UI.

apiVersion: 1

groups:
  - orgId: 1
    name: roomly-errors
    folder: Roomly
    interval: 1m
    rules:
      - uid: roomly_nest_http_5xx
        title: Nest HTTP 5xx
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Nest services are returning HTTP 5xx
          description: Open Roomly Nest and Logs and Traces dashboards, then follow log TraceID to Jaeger.
        labels:
          severity: critical
          team: roomly
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(http_server_request_duration_count{http_response_status_code=~"5.."}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: roomly_nest_error_logs
        title: Nest error logs
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Error-level logs detected from Nest services
          description: Open Logs and Traces dashboard, filter errors, click View trace.
        labels:
          severity: warning
          team: roomly
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({compose_service=~"gateway|user-service|notification-service"} | json | level=~"(50|error|ERROR)" [5m])) or vector(0)
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  type: query
